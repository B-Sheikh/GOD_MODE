<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GOD MODE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="titlebar">
    <div class="logo">GOD MODE</div>
    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-terminal">CHAT</button>
      <button class="tab-btn" id="tab-network">NETWORK</button>
    </div>
    <div class="window-controls">
      <button id="min-btn">-</button>
      <button id="close-btn">X</button>
    </div>
  </div>
  
  <div class="app-container">
    <!-- CHAT VIEW -->
    <main id="view-terminal" class="chat-container view-section active">
      <div id="chat-history" class="chat-history">
        <div class="message system">
          <div class="avatar">🧠</div>
          <div class="content">System Online. Swarm of 75+ AI models ready for deployment. What would you like to generate?</div>
        </div>
      </div>
      <div class="input-area">
        <textarea id="prompt-input" placeholder="Ask the Swarm to generate code, images, video, or solve complex problems..."></textarea>
        <button id="send-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2L15 22L11 13M11 13L2 9L22 2"/></svg>
        </button>
      </div>
    </main>

    <!-- NETWORK VIEW (DENSE CLUSTER) -->
    <main id="view-network" class="network-container view-section">
      <div class="network-canvas-container">
        <svg id="network-lines" class="network-svg"></svg>
        
        <div class="column left" id="col-input"></div>
        <div class="column" id="col-hidden-1"></div>
        <div class="column" id="col-hidden-2"></div>
        <div class="column right" id="col-output"></div>
      </div>
    </main>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
